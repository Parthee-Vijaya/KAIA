name: KAIA checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaia_fixture
          POSTGRES_PASSWORD: fixture_database_only
          POSTGRES_DB: kaia_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaia_fixture -d kaia_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kaia_fixture:fixture_database_only@127.0.0.1:5432/kaia_fixture
      KAIA_APP_URL: http://127.0.0.1:3210
      KAIA_TEST_MODE: '0'
      KAIA_DEFAULT_PROVIDER: demo
      KAIA_DATASET_VERSION: KAIA-DEMO-2026.09-v4
      KAIA_DATASET_SEED: kaia-kalundborg-2026
      KAIA_REFERENCE_DATE: '2026-09-30'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Generate ephemeral fixture keys
        run: >-
          node --input-type=module -e 'import{randomBytes}from"node:crypto";import{appendFileSync}from"node:fs";appendFileSync(process.env.GITHUB_ENV,"KAIA_SESSION_SECRET="+randomBytes(48).toString("base64url")+"\nKAIA_ENCRYPTION_KEY="+randomBytes(32).toString("base64")+"\n")'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run test:database
      - run: npm run build:clean
